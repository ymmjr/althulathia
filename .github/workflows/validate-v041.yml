name: Validate Vault Web

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python
        run: python -m py_compile server.py email_auth.py
      - name: Check JavaScript in web pages
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('/tmp/vault-js')
          out.mkdir(exist_ok=True)
          count = 0
          for page in Path('web').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              start = 0
              part = 0
              while True:
                  i = text.find('<script>', start)
                  if i < 0:
                      break
                  j = text.find('</script>', i)
                  if j < 0:
                      raise SystemExit(f'Unclosed <script> in {page}')
                  script = text[i + len('<script>'):j]
                  target = out / f'{page.stem}-{part}.js'
                  target.write_text(script, encoding='utf-8')
                  print(target)
                  count += 1
                  part += 1
                  start = j + len('</script>')
          if not count:
              raise SystemExit('No scripts found')
          PY
          for file in /tmp/vault-js/*.js; do node --check "$file"; done

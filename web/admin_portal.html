<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/webp" href="/brand.webp">
<link rel="apple-touch-icon" href="/brand.webp">
<meta name="theme-color" content="#1066AB">
<title>الثلاثية الثقافية — لوحة الإدارة</title>
<style>
:root{
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  --bg:#F5FAFD;--paper:#FFFFFF;--ink:#082F52;--muted:#66859A;
  --blue:#1066AB;--blue2:#1685D2;--navy:#063A65;--orange:#F58D27;--orange2:#FFAA55;
  --line:#D5E4ED;--soft:#F7FBFE;--softBlue:#EAF5FB;--softOrange:#FFF4E8;
  --ok:#24A36D;--danger:#D64E4A;--warning:#E7A019;--shadow:0 14px 42px rgba(13,94,145,.10)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);background:
linear-gradient(145deg,#FBFDFF 0,#F2F8FC 55%,#EAF4FA 100%);position:relative}.hidden{display:none!important}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;opacity:.55}
body:before{width:260px;height:260px;right:-95px;top:105px;background:linear-gradient(145deg,#1066AB22,#3EB0F511);clip-path:polygon(100% 0,0 0,100% 100%)}
body:after{width:220px;height:220px;left:-80px;bottom:30px;background:linear-gradient(145deg,#F58D2725,#FFB87510);clip-path:polygon(0 100%,100% 100%,0 0)}
.adminNav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-bottom:1px solid #DCE9F0;box-shadow:0 8px 26px rgba(9,75,117,.07)}
.navInner{max-width:1320px;margin:auto;padding:9px 18px;display:flex;align-items:center;gap:18px}
.navBrand{display:flex;align-items:center;flex:0 0 auto}.navBrand img{width:128px;height:54px;object-fit:contain}
.navScroll{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px}.navScroll::-webkit-scrollbar{display:none}
.navLink{white-space:nowrap;text-decoration:none;color:#32627F;font-weight:800;padding:11px 15px;border-radius:12px;transition:.18s ease;border:1px solid transparent}
.navLink:hover{background:#EDF6FB;color:var(--blue)}.navLink.active{background:#E9F4FB;color:var(--blue);border-color:#CFE4F0;box-shadow:inset 0 -3px 0 var(--blue)}
.navUser{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-inline-start:12px;border-inline-start:1px solid #E3EDF3}
.role{font-size:12px;font-weight:900;background:#E9F4FB;color:var(--blue);border:1px solid #CBE1EF;border-radius:999px;padding:7px 11px}
.logoutMini{border:1px solid #BBD4E2;background:#fff;color:var(--blue);border-radius:10px;padding:8px 11px;font-weight:900;cursor:pointer}
.page{max-width:1320px;margin:auto;padding:30px 20px 56px}
.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.pageHead h1{margin:0;font-size:clamp(29px,3.5vw,42px);letter-spacing:-.02em}.pageHead p{margin:7px 0 0;color:var(--muted);line-height:1.8;font-weight:600}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:22px;padding:21px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:auto auto -58px -58px;width:130px;height:130px;background:#1066AB08;clip-path:polygon(0 100%,100% 100%,0 0)}
.card h2,.card h3{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,#FFFFFF,#F6FBFE);border:1px solid #D7E7F0;border-radius:18px;padding:18px;min-height:122px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:75px;height:75px;left:-22px;top:-22px;background:#1066AB0D;transform:rotate(45deg)}
.stat span{display:block;color:var(--muted);font-weight:800}.stat b{display:block;font-size:36px;margin-top:7px;color:var(--blue);line-height:1}
input,select,textarea{width:100%;padding:14px 15px;border:1px solid #BFD5E2;background:#FBFDFF;color:var(--ink);border-radius:12px;font-size:16px;outline:none;transition:.18s ease;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #F58D2722}textarea{resize:vertical;min-height:105px}
button,.btn{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s ease;box-shadow:0 6px 14px rgba(16,102,171,.12)}
button:hover,.btn:hover{transform:translateY(-1px)}.btn.secondary,button.secondary{background:#fff;color:var(--blue);border:1px solid #A9CBDE;box-shadow:none}
.btn.orange,button.orange{background:linear-gradient(135deg,var(--orange),#FF781F)}button.danger,.btn.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:24px;margin-top:10px;font-weight:800}.msg.ok{color:var(--ok)}.msg.err{color:var(--danger)}.muted{color:var(--muted);line-height:1.8}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.room{background:#FBFDFF;border:1px solid #D6E6EF;border-radius:18px;padding:17px;position:relative;transition:.18s ease}.room:hover{border-color:#AFCFE0;box-shadow:0 9px 22px rgba(12,89,138,.07)}
.room.privateRoom{background:linear-gradient(135deg,#FFFDFC,#FFF5EB);border-color:#F7C89C}.room h3{margin:0 0 4px;font-size:20px}.roomCode{font-size:24px;font-weight:1000;letter-spacing:.1em;color:var(--orange);text-align:start}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{font-size:12px;font-weight:900;border-radius:999px;padding:5px 9px;background:#EAF4FA;color:var(--blue)}.badge.private{background:#FFF0E2;color:#A6560C}
.empty{border:1px dashed #B8D2E2;border-radius:14px;padding:26px;color:var(--muted);text-align:center;background:#FBFDFF}
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sectionHead h2{margin:0}
.privateZone{background:linear-gradient(145deg,#FFFFFF,#FFF8F1);border-color:#F5C999}.privateZone:before{background:#F58D2710}
.packZone{background:linear-gradient(180deg,#fff,#FAFDFF)}.users{display:grid;gap:10px}
.user{background:#FBFDFF;border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.user strong{font-size:18px}
.status{font-weight:900}.status.approved{color:var(--ok)}.status.pending{color:var(--orange)}.status.rejected,.status.disabled{color:var(--danger)}
.packGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pack{background:#FBFDFF;border:1px solid var(--line);border-radius:16px;padding:15px;position:relative}.packReady{color:var(--ok);font-weight:900}.packMissing{color:var(--danger);font-weight:900}
.divider{height:1px;background:#E1ECF2;margin:20px 0}.permission{max-width:720px;margin:40px auto;text-align:center}
.accountBox{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.accountItem{background:#FBFDFF;border:1px solid var(--line);border-radius:14px;padding:15px}.accountItem span{display:block;color:var(--muted);font-size:13px;font-weight:800}.accountItem b{display:block;margin-top:5px;overflow-wrap:anywhere}.ltrData{direction:ltr;unicode-bidi:isolate;display:inline-block}.emailData{direction:ltr;unicode-bidi:isolate;text-align:left}.fileInput{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}.filePicker{display:inline-flex;align-items:center;justify-content:center;border:1px solid #A9CBDE;background:#fff;color:var(--blue);border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.fileName{font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dashboardHero{display:flex;justify-content:space-between;align-items:center;gap:18px;background:linear-gradient(135deg,#0B5C9B,#1685D2);color:#fff;border:0}
.dashboardHero:before{width:200px;height:200px;left:20px;bottom:-105px;background:#ffffff10}.dashboardHero h1{margin:0;font-size:34px}.dashboardHero p{margin:7px 0 0;color:#DBF1FF}
.questionEditor{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:900;color:#4E7188}.field.full{grid-column:1/-1}.answerFields{grid-column:1/-1}.answersGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rankAnswer{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:7px}.rankNo{height:47px;display:grid;place-items:center;border-radius:11px;background:#FFF2E5;color:#A95B10;border:1px solid #F3CCA5;font-weight:1000}.bankFilters{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:9px;align-items:end}.bankList{display:grid;gap:10px}.bankItem{border:1px solid #D6E6EF;border-radius:17px;padding:16px;background:#FBFDFF}.bankItem.off{opacity:.66;background:#F5F7F9}.bankHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.questionText{font-size:18px;font-weight:1000;line-height:1.7}.bankBadges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.bankAnswer{background:#fff;border:1px solid #E0EAF0;border-radius:12px;padding:10px 12px;color:#526F82;line-height:1.8}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#EAF4FA;color:var(--blue);font-size:12px;font-weight:900}.pill.diff1{background:#E7F6EF;color:#18724F}.pill.diff2{background:#FFF4E2;color:#9D6118}.pill.diff3{background:#FCE8E5;color:#9A3D37}.pill.off{background:#ECEFF2;color:#71808A}.questionStats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.questionStat{border:1px solid #D8E7EF;background:#F9FCFE;border-radius:14px;padding:12px;text-align:center}.questionStat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.questionStat b{display:block;font-size:25px;color:var(--blue);margin-top:4px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.packGrid{grid-template-columns:1fr 1fr}.navUser .role{display:none}}
@media(max-width:700px){.navInner{padding:8px 10px;gap:7px}.navBrand img{width:96px;height:44px}.navLink{padding:9px 11px}.navUser{display:none}.page{padding:20px 12px 42px}.pageHead{align-items:flex-start;flex-direction:column}.grid2,.rooms,.user,.accountBox,.questionEditor,.answersGrid,.bankFilters{grid-template-columns:1fr}.field.full,.answerFields{grid-column:auto}.questionStats{grid-template-columns:1fr 1fr}.packGrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.card{padding:16px}.dashboardHero{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="adminNav">
  <div class="navInner">
    <a class="navBrand" href="/admin/dashboard"><img src="/brand.webp" alt="الثلاثية الثقافية"></a>
    <nav class="navScroll" aria-label="أقسام الإدارة">
      <a class="navLink" data-page="dashboard" href="/admin/dashboard">الرئيسية</a>
      <a class="navLink" data-page="rooms" href="/admin/rooms">الغرف</a>
      <a id="questionsNav" class="navLink hidden" data-page="questions" href="/admin/questions">بنك الأسئلة</a>
      <a id="accountsNav" class="navLink hidden" data-page="accounts" href="/admin/accounts">الحسابات</a>
      <a class="navLink" data-page="archive" href="/admin/archive">الأرشيف</a>
      <a class="navLink" data-page="settings" href="/admin/settings">الإعدادات</a>
    </nav>
    <div class="navUser"><span id="navRole" class="role"></span><button id="logoutMini" class="logoutMini">خروج</button></div>
  </div>
</header>
<main class="page">
  <div id="root"><div class="card">جاري تحميل لوحة الإدارة…</div></div>
</main>
<script>
const $=id=>document.getElementById(id),root=$('root');let USER=null,ROOMS=[],USERS=[],BANK=[],BANK_USAGE={},EDIT_QUESTION_ID='';
const page=(location.pathname.split('/').filter(Boolean)[1]||'dashboard').toLowerCase();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function roleAr(r){return r==='super_admin'?'مسؤول رئيسي':r==='assistant_admin'?'مسؤول مساعد':'مشرف'}
function statusAr(s){return ({approved:'معتمد',pending:'بانتظار الاعتماد',email_unverified:'بانتظار تأكيد البريد',rejected:'مرفوض',disabled:'موقوف'}[s]||s)}
async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',...opt});let d={};try{d=await r.json()}catch{}return {r,d}}
async function post(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
function setMsg(id,d){const e=$(id);if(!e)return;e.textContent=d.message||'';e.className='msg '+(d.ok?'ok':'err')}
function nav(){document.querySelectorAll('.navLink').forEach(a=>a.classList.toggle('active',a.dataset.page===page));$('navRole').textContent=roleAr(USER.role);const contentAdmin=['super_admin','assistant_admin'].includes(USER.role);$('questionsNav').classList.toggle('hidden',!contentAdmin);$('accountsNav').classList.toggle('hidden',USER.role!=='super_admin')}
function head(title,desc,extra=''){return '<div class="pageHead"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+extra+'</div>'}
function roomCard(r,archived=false){const privateBadge=r.is_private?'<span class="badge private">🔒 مهرجان خاص</span>':'';const owner=r.owner_name?'<span class="badge">'+esc(r.owner_name)+'</span>':'';const pack=r.is_private&&r.question_pack_label?'<div class="muted">'+esc(r.question_pack_label)+' · إصدار '+Number(r.question_pack_version||1)+'</div>':'';const url=archived?'/admin/archive/room?code='+encodeURIComponent(r.code):'/admin/room?code='+encodeURIComponent(r.code);return '<article class="room '+(r.is_private?'privateRoom':'')+'"><div class="roomCode"><bdi dir="ltr">'+esc(r.code)+'</bdi></div><h3>'+esc(r.name)+'</h3><div class="badges">'+privateBadge+owner+'<span class="badge">'+esc(r.phase_ar)+'</span></div>'+pack+'<div class="muted">'+Number(r.team_count||0)+' فريقًا</div><div class="actions"><a class="btn" href="'+url+'">'+(archived?'فتح السجل':'إدارة الغرفة')+'</a><a class="btn secondary" target="_blank" href="/display?code='+encodeURIComponent(r.code)+'">شاشة العرض</a></div></article>'}
async function loadRooms(){const {r,d}=await api('/api/admin/rooms');if(!r.ok){if(r.status===401)return location.href='/admin';throw new Error(d.message||'تعذر تحميل الغرف')}ROOMS=d.rooms||[];return ROOMS}
async function renderDashboard(){await loadRooms();const active=ROOMS.filter(r=>!r.is_archived),arch=ROOMS.filter(r=>r.is_archived),priv=ROOMS.filter(r=>r.is_private),teams=active.reduce((n,r)=>n+Number(r.team_count||0),0);root.innerHTML='<section class="card dashboardHero"><div><h1>أهلًا '+esc(USER.name)+'</h1><p>هذه نظرة سريعة على حالة منصة الثلاثية الثقافية.</p></div><span class="role">'+roleAr(USER.role)+'</span></section>'+'<section class="stats"><div class="stat"><span>الغرف النشطة</span><b>'+active.length+'</b></div><div class="stat"><span>الفرق داخل النشط</span><b>'+teams+'</b></div><div class="stat"><span>الغرف الخاصة</span><b>'+priv.length+'</b></div><div class="stat"><span>في الأرشيف</span><b>'+arch.length+'</b></div></section><section class="card"><div class="sectionHead"><h2>أحدث الغرف النشطة</h2><a class="btn secondary" href="/admin/rooms">عرض كل الغرف</a></div><div class="rooms">'+(active.slice(0,4).map(r=>roomCard(r)).join('')||'<div class="empty">لا توجد غرف نشطة حاليًا.</div>')+'</div></section>'}
async function renderRooms(){await loadRooms();const privileged=['super_admin','assistant_admin'].includes(USER.role);const active=ROOMS.filter(r=>!r.is_archived&&!r.is_private),privateActive=ROOMS.filter(r=>!r.is_archived&&r.is_private);root.innerHTML=head('الغرف','كل غرفة جديدة تسحب أسئلتها مباشرة من بنك الأسئلة عند بدء الخزنة.')+'<section class="card"><h2>إنشاء غرفة عادية</h2><div class="grid2"><input id="roomName" maxlength="80" placeholder="اسم الغرفة — مثال: الغرفة الأولى"><button id="createRoom" class="orange">إنشاء الغرفة</button></div><div id="roomMsg" class="msg"></div></section><section class="card"><div class="sectionHead"><h2>الغرف العادية الحالية</h2><button id="refreshRooms" class="secondary">تحديث</button></div><div id="normalRooms" class="rooms">'+(active.map(r=>roomCard(r)).join('')||'<div class="empty">لا توجد غرف عادية نشطة.</div>')+'</div></section>'+(privileged?'<section class="card privateZone"><h2>غرفة مهرجان خاصة</h2><p class="muted">تظهر للمسؤول الرئيسي والمسؤول المساعد فقط، وتسحب أسئلة الخزنة من بنك الأسئلة عند بدء الجولة.</p><div class="grid2"><input id="privateRoomName" maxlength="80" placeholder="اسم الغرفة الخاصة"><button id="createPrivate" class="orange">إنشاء غرفة خاصة</button></div><div id="privateMsg" class="msg"></div><div class="divider"></div><h3>الغرف الخاصة الحالية</h3><div class="rooms">'+(privateActive.map(r=>roomCard(r)).join('')||'<div class="empty">لا توجد غرف خاصة نشطة.</div>')+'</div></section>':'');$('createRoom').onclick=createNormal;$('refreshRooms').onclick=renderRooms;if(privileged)$('createPrivate').onclick=createPrivate}
async function createNormal(){const {r,d}=await post('/api/admin/create_room',{room_name:$('roomName').value.trim(),room_type:'normal'});setMsg('roomMsg',d);if(r.ok)location.href='/admin/room?code='+encodeURIComponent(d.room.code)}
async function createPrivate(){const {r,d}=await post('/api/admin/create_room',{room_name:$('privateRoomName').value.trim(),room_type:'private'});setMsg('privateMsg',d);if(r.ok)location.href='/admin/room?code='+encodeURIComponent(d.room.code)}

function segmentAr(s){return ({vault:'الخزنة',top_ten:'أعلى عشرة',qa:'سؤال وجواب'}[s]||s)}
function diffAr(d){return ({1:'سهل',2:'متوسط',3:'صعب'}[Number(d)]||d)}
function answerEditorHtml(segment,item=null){
  if(segment==='top_ten'){
    const answers=item&&item.answer_data&&Array.isArray(item.answer_data.answers)?item.answer_data.answers:[];
    return '<div class="field full"><label>الإجابات الرسمية مرتبة من 1 إلى 10</label><div class="answersGrid">'+Array.from({length:10},(_,i)=>'<div class="rankAnswer"><span class="rankNo">'+(i+1)+'</span><input id="bankRank_'+(i+1)+'" maxlength="500" placeholder="الإجابة رقم '+(i+1)+'" value="'+esc(answers[i]||'')+'"></div>').join('')+'</div></div>';
  }
  const value=item&&item.answer_data?item.answer_data.correct_answer||'':'';
  return '<div class="field full"><label>الإجابة الصحيحة</label><textarea id="bankCorrect" maxlength="1200" placeholder="اكتب الإجابة الصحيحة">'+esc(value)+'</textarea></div>';
}
function renderAnswerEditor(item=null){const e=$('bankAnswerFields');if(e)e.innerHTML=answerEditorHtml($('bankSegment').value,item)}
async function loadBank(){const {r,d}=await api('/api/admin/questions');if(!r.ok)throw new Error(d.message||'تعذر تحميل بنك الأسئلة');BANK=d.items||[];BANK_USAGE=d.usage||{};return BANK}
function bankStatsHtml(items){return '<div class="questionStats"><div class="questionStat"><span>إجمالي الأسئلة</span><b>'+items.length+'</b></div><div class="questionStat"><span>المفعلة</span><b>'+items.filter(x=>x.enabled).length+'</b></div><div class="questionStat"><span>المستخدمة لك</span><b>'+items.filter(x=>x.used_by_you).length+'</b></div><div class="questionStat"><span>صعوبة 3</span><b>'+items.filter(x=>Number(x.difficulty)===3).length+'</b></div></div>'}
function vaultAvailabilityHtml(){const c=BANK_USAGE.vault_available_by_difficulty||{'1':0,'2':0,'3':0},rounds=Number(BANK_USAGE.vault_rounds_remaining||0);return '<div class="questionStats"><div class="questionStat"><span>متاح لك — مستوى 1</span><b>'+Number(c['1']||0)+'</b></div><div class="questionStat"><span>متاح لك — مستوى 2</span><b>'+Number(c['2']||0)+'</b></div><div class="questionStat"><span>متاح لك — مستوى 3</span><b>'+Number(c['3']||0)+'</b></div><div class="questionStat"><span>جولات خزنة كاملة متبقية</span><b>'+rounds+'</b></div></div>'+(rounds<=1?'<div class="msg err">تنبيه: مخزون أسئلة الخزنة لهذا الحساب منخفض. أضف أسئلة جديدة قبل الحاجة لجولات إضافية.</div>':'')}
function bankAnswerHtml(q){
  if(q.segment==='top_ten'){const a=q.answer_data&&q.answer_data.answers||[];return '<ol style="margin:0;padding-inline-start:22px">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'}
  return '<b>الإجابة:</b> '+esc(q.answer_data&&q.answer_data.correct_answer||'—')
}
function bankCard(q){return '<article class="bankItem '+(q.enabled?'':'off')+'"><div class="bankHead"><div><div class="questionText">'+esc(q.question_text)+'</div><div class="bankBadges"><span class="pill">'+segmentAr(q.segment)+'</span><span class="pill diff'+Number(q.difficulty)+'">الصعوبة '+Number(q.difficulty)+' · '+diffAr(q.difficulty)+'</span><span class="pill '+(q.enabled?'':'off')+'">'+(q.enabled?'مفعّل':'غير مفعّل')+'</span>'+(q.used_by_you?'<span class="pill off">استُخدم لك سابقًا</span>':'')+'</div></div></div><div class="bankAnswer">'+bankAnswerHtml(q)+'</div><div class="actions"><button onclick="editBankQuestion(\''+q.id+'\')">تعديل</button><button class="secondary" onclick="toggleBankQuestion(\''+q.id+'\','+(!q.enabled)+')">'+(q.enabled?'تعطيل':'تفعيل')+'</button><button class="danger" onclick="deleteBankQuestion(\''+q.id+'\')">حذف</button></div></article>'}
function renderBankList(){const seg=$('bankFilterSegment')?$('bankFilterSegment').value:'',diff=$('bankFilterDifficulty')?$('bankFilterDifficulty').value:'',status=$('bankFilterStatus')?$('bankFilterStatus').value:'';let items=BANK.slice();if(seg)items=items.filter(x=>x.segment===seg);if(diff)items=items.filter(x=>String(x.difficulty)===diff);if(status==='enabled')items=items.filter(x=>x.enabled);if(status==='disabled')items=items.filter(x=>!x.enabled);$('bankAvailability').innerHTML=vaultAvailabilityHtml();$('bankStats').innerHTML=bankStatsHtml(items);$('bankList').innerHTML=items.length?items.map(bankCard).join(''):'<div class="empty">لا توجد أسئلة مطابقة لهذا الفلتر.</div>'}
function clearBankForm(){EDIT_QUESTION_ID='';$('bankEditorTitle').textContent='إضافة سؤال جديد';$('bankSegment').value='vault';$('bankQuestion').value='';$('bankDifficulty').value='1';$('bankEnabled').checked=true;$('cancelBankEdit').classList.add('hidden');$('saveBankQuestion').textContent='إضافة السؤال';renderAnswerEditor()}
function collectBankForm(){const segment=$('bankSegment').value,body={segment,question:$('bankQuestion').value.trim(),difficulty:Number($('bankDifficulty').value),enabled:$('bankEnabled').checked};if(segment==='top_ten')body.answers=Array.from({length:10},(_,i)=>$('bankRank_'+(i+1)).value.trim());else body.correct_answer=$('bankCorrect').value.trim();return body}
async function saveBankQuestion(){const body=collectBankForm();if(EDIT_QUESTION_ID)body.question_id=EDIT_QUESTION_ID;const path=EDIT_QUESTION_ID?'/api/admin/questions/update':'/api/admin/questions/create';$('saveBankQuestion').disabled=true;const {r,d}=await post(path,body);$('saveBankQuestion').disabled=false;setMsg('bankMsg',d);if(r.ok){await loadBank();renderBankList();clearBankForm();window.scrollTo({top:0,behavior:'smooth'})}}
function editBankQuestion(id){const q=BANK.find(x=>x.id===id);if(!q)return;EDIT_QUESTION_ID=q.id;$('bankEditorTitle').textContent='تعديل السؤال';$('bankSegment').value=q.segment;$('bankQuestion').value=q.question_text;$('bankDifficulty').value=String(q.difficulty);$('bankEnabled').checked=!!q.enabled;$('cancelBankEdit').classList.remove('hidden');$('saveBankQuestion').textContent='حفظ التعديل';renderAnswerEditor(q);window.scrollTo({top:0,behavior:'smooth'})}
async function toggleBankQuestion(id,enabled){const {r,d}=await post('/api/admin/questions/toggle',{question_id:id,enabled});setMsg('bankListMsg',d);if(r.ok){await loadBank();renderBankList()}}
async function deleteBankQuestion(id){const q=BANK.find(x=>x.id===id);if(!q)return;if(!confirm('حذف هذا السؤال نهائيًا من بنك الأسئلة؟\n\n'+q.question_text))return;const {r,d}=await post('/api/admin/questions/delete',{question_id:id});setMsg('bankListMsg',d);if(r.ok){if(EDIT_QUESTION_ID===id)clearBankForm();await loadBank();renderBankList()}}
async function renderQuestions(){
  if(!['super_admin','assistant_admin'].includes(USER.role)){root.innerHTML='<section class="card permission"><h2>هذه الصفحة غير متاحة لحسابك</h2><p class="muted">بنك الأسئلة متاح للمسؤول الرئيسي والمسؤول المساعد.</p></section>';return}
  await loadBank();
  root.innerHTML=head('بنك الأسئلة','إدارة محتوى فقرات الثلاثية الثقافية من مكان واحد، مع تحديد مستوى الصعوبة من 1 إلى 3.')+
  '<section class="card"><div class="sectionHead"><div><h2 id="bankEditorTitle">إضافة سؤال جديد</h2><div class="muted">اختر الفقرة، اكتب السؤال والإجابة، ثم حدد مستوى الصعوبة.</div></div></div><div class="questionEditor"><div class="field"><label>الفقرة</label><select id="bankSegment"><option value="vault">الخزنة</option><option value="top_ten">أعلى عشرة</option><option value="qa">سؤال وجواب</option></select></div><div class="field"><label>مستوى الصعوبة</label><select id="bankDifficulty"><option value="1">1 — سهل</option><option value="2">2 — متوسط</option><option value="3">3 — صعب</option></select></div><div class="field full"><label>نص السؤال</label><textarea id="bankQuestion" maxlength="1200" placeholder="اكتب نص السؤال هنا"></textarea></div><div id="bankAnswerFields" class="answerFields"></div><div class="field full"><label style="display:flex;align-items:center;gap:9px"><input id="bankEnabled" type="checkbox" checked style="width:auto"> مفعّل وجاهز للاستخدام لاحقًا</label></div></div><div class="actions"><button id="saveBankQuestion" class="orange">إضافة السؤال</button><button id="cancelBankEdit" class="secondary hidden">إلغاء التعديل</button></div><div id="bankMsg" class="msg"></div></section>'+
  '<section class="card"><div class="sectionHead"><div><h2>الأسئلة الموجودة</h2><div class="muted">السؤال الذي استُخدم في إحدى غرفك لن يعود لك مرة ثانية. يبدأ احتساب الاستخدام من تفعيل النظام الجديد.</div></div><button id="refreshBank" class="secondary">تحديث</button></div><div id="bankAvailability"></div><div class="bankFilters"><div class="field"><label>الفقرة</label><select id="bankFilterSegment"><option value="">كل الفقرات</option><option value="vault">الخزنة</option><option value="top_ten">أعلى عشرة</option><option value="qa">سؤال وجواب</option></select></div><div class="field"><label>الصعوبة</label><select id="bankFilterDifficulty"><option value="">كل المستويات</option><option value="1">1 — سهل</option><option value="2">2 — متوسط</option><option value="3">3 — صعب</option></select></div><div class="field"><label>الحالة</label><select id="bankFilterStatus"><option value="">الكل</option><option value="enabled">مفعّل</option><option value="disabled">غير مفعّل</option></select></div><button id="clearBankFilters" class="secondary">مسح الفلاتر</button></div><div id="bankStats"></div><div id="bankList" class="bankList"></div><div id="bankListMsg" class="msg"></div></section>';
  $('bankSegment').onchange=()=>renderAnswerEditor();
  $('saveBankQuestion').onclick=saveBankQuestion;
  $('cancelBankEdit').onclick=clearBankForm;
  $('refreshBank').onclick=async()=>{await loadBank();renderBankList()};
  ['bankFilterSegment','bankFilterDifficulty','bankFilterStatus'].forEach(id=>$(id).onchange=renderBankList);
  $('clearBankFilters').onclick=()=>{$('bankFilterSegment').value='';$('bankFilterDifficulty').value='';$('bankFilterStatus').value='';renderBankList()};
  clearBankForm();renderBankList();
}

async function renderAccounts(){if(USER.role!=='super_admin'){root.innerHTML='<section class="card permission"><h2>هذه الصفحة للمسؤول الرئيسي فقط</h2><p class="muted">حسابك لا يملك صلاحية إدارة الحسابات.</p><a class="btn" href="/admin/dashboard">العودة للرئيسية</a></section>';return}const {r,d}=await api('/api/admin/users');if(!r.ok)throw new Error(d.message||'تعذر تحميل الحسابات');USERS=d.users||[];root.innerHTML=head('الحسابات','اعتماد المشرفين وتحديد المسؤول المساعد وإدارة حالة الحسابات.')+'<section class="card"><div class="sectionHead"><h2>الحسابات المسجلة</h2><button id="refreshUsers" class="secondary">تحديث</button></div><div class="users">'+USERS.map(userHtml).join('')+'</div><div id="usersMsg" class="msg"></div></section>';$('refreshUsers').onclick=renderAccounts;document.querySelectorAll('[data-user-action]').forEach(b=>b.onclick=()=>userAction(b.dataset.userAction,b.dataset.user,b.dataset.role||''))}
function userHtml(u){const mine=u.id===USER.id;if(u.role==='super_admin')return '<article class="user"><div><strong>'+esc(u.name)+'</strong><div class="muted emailData"><bdi dir="ltr">'+esc(u.email)+'</bdi></div><div class="status approved">مسؤول رئيسي</div></div><span class="badge">الحساب الرئيسي</span></article>';let buttons='';if(u.status==='pending')buttons+='<button data-user-action="approve" data-user="'+u.id+'">اعتماد</button><button class="danger" data-user-action="reject" data-user="'+u.id+'">رفض</button>';if(u.status==='approved'){buttons+='<button class="secondary" data-user-action="role" data-role="'+(u.role==='assistant_admin'?'supervisor':'assistant_admin')+'" data-user="'+u.id+'">'+(u.role==='assistant_admin'?'تحويل إلى مشرف':'تعيين مسؤول مساعد')+'</button><button class="danger" data-user-action="disable" data-user="'+u.id+'">إيقاف</button>'}if(['disabled','rejected'].includes(u.status))buttons+='<button data-user-action="approve" data-user="'+u.id+'">إعادة اعتماد</button>';buttons+='<button class="secondary" data-user-action="delete" data-user="'+u.id+'">حذف</button>';return '<article class="user"><div><strong>'+esc(u.name)+'</strong><div class="muted emailData"><bdi dir="ltr">'+esc(u.email)+'</bdi></div><div class="status '+esc(u.status)+'">'+roleAr(u.role)+' · '+statusAr(u.status)+'</div></div><div class="actions">'+buttons+'</div></article>'}
async function userAction(action,id,role){let path='/api/admin/users/'+action,body={user_id:id};if(action==='role'){path='/api/admin/users/set-role';body.role=role}if(action==='delete'&&!confirm('حذف هذا الحساب؟ ستبقى سجلات غرفه السابقة محفوظة.'))return;const {r,d}=await post(path,body);setMsg('usersMsg',d);if(r.ok)setTimeout(renderAccounts,250)}
async function renderArchive(){await loadRooms();const archived=ROOMS.filter(r=>r.is_archived),normal=archived.filter(r=>!r.is_private),priv=archived.filter(r=>r.is_private);root.innerHTML=head('الأرشيف','الغرف المنتهية أو المغلقة محفوظة مع نتائجها وسجل الأحداث الكامل.')+'<section class="card"><h2>الغرف العادية</h2><div class="rooms">'+(normal.map(r=>roomCard(r,true)).join('')||'<div class="empty">لا توجد غرف عادية مؤرشفة.</div>')+'</div></section>'+(['super_admin','assistant_admin'].includes(USER.role)?'<section class="card"><h2>غرف المهرجان الخاصة</h2><div class="rooms">'+(priv.map(r=>roomCard(r,true)).join('')||'<div class="empty">لا توجد غرف خاصة مؤرشفة.</div>')+'</div></section>':'')}
function renderSettings(){root.innerHTML=head('الإعدادات','معلومات حسابك وإعدادات الجلسة الحالية.')+'<section class="card"><h2>الحساب</h2><div class="accountBox"><div class="accountItem"><span>الاسم</span><b>'+esc(USER.name)+'</b></div><div class="accountItem"><span>البريد الإلكتروني</span><b class="emailData"><bdi dir="ltr">'+esc(USER.email)+'</bdi></b></div><div class="accountItem"><span>الصلاحية</span><b>'+roleAr(USER.role)+'</b></div><div class="accountItem"><span>حالة الحساب</span><b>'+statusAr(USER.status)+'</b></div></div><div class="actions"><button id="settingsLogout" class="danger">تسجيل الخروج</button><a class="btn secondary" href="/">صفحة دخول الفرق</a></div></section>';$('settingsLogout').onclick=logout}
async function logout(){await post('/api/auth/logout',{});location.href='/admin'}
async function boot(){const {r,d}=await api('/api/auth/status');if(!r.ok||!d.logged_in){location.href='/admin';return}USER=d.user;nav();$('logoutMini').onclick=logout;try{if(page==='dashboard')await renderDashboard();else if(page==='rooms')await renderRooms();else if(page==='questions')await renderQuestions();else if(page==='accounts')await renderAccounts();else if(page==='archive')await renderArchive();else if(page==='settings')renderSettings();else location.replace('/admin/dashboard')}catch(e){root.innerHTML='<section class="card"><h2>تعذر تحميل الصفحة</h2><p class="muted">'+esc(e.message||e)+'</p><button onclick="location.reload()">إعادة المحاولة</button></section>'}}
boot();
</script>
</body></html>

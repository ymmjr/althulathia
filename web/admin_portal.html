<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/webp" href="/brand.webp">
<link rel="apple-touch-icon" href="/brand.webp">
<meta name="theme-color" content="#1066AB">
<title>الثلاثية الثقافية — لوحة الإدارة</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;--bg:#F4F9FC;--paper:#fff;--ink:#083C61;--muted:#638398;--blue:#1066AB;--orange:#F58D27;--line:#C8DDE9;--soft:#F8FCFF;--ok:#2B9B67;--danger:#C94B45;--shadow:#0b5f941a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(145deg,#F8FCFE 0,#EAF4FA 100%);color:var(--ink);min-height:100vh}.hidden{display:none!important}
.adminNav{position:sticky;top:0;z-index:50;background:#ffffffee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);box-shadow:0 8px 28px #0b5f940d}
.navInner{max-width:1240px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px}.navBrand{display:flex;align-items:center;flex:0 0 auto}.navBrand img{width:118px;height:48px;object-fit:contain}
.navScroll{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1;padding:3px}.navScroll::-webkit-scrollbar{display:none}.navLink{white-space:nowrap;text-decoration:none;color:var(--blue);font-weight:900;padding:10px 14px;border-radius:12px;border:1px solid transparent}.navLink:hover{background:#EAF4FA}.navLink.active{background:var(--blue);color:#fff}
.navUser{display:flex;align-items:center;gap:8px;flex:0 0 auto}.role{font-size:12px;font-weight:900;background:#FFF0E2;color:#A6560C;border:1px solid #F7BE86;border-radius:999px;padding:6px 9px}.logoutMini{border:1px solid #9FC5DA;background:#fff;color:var(--blue);border-radius:10px;padding:8px 10px;font-weight:900;cursor:pointer}
.page{max-width:1240px;margin:auto;padding:26px 18px 50px}.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}.pageHead h1{margin:0;font-size:clamp(28px,4vw,42px)}.pageHead p{margin:7px 0 0;color:var(--muted);line-height:1.8}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 14px 40px var(--shadow);margin-bottom:16px}.card h2,.card h3{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:18px}.stat span{display:block;color:var(--muted);font-weight:800}.stat b{display:block;font-size:34px;margin-top:7px;color:var(--blue)}
input,select{width:100%;padding:14px 15px;border:1px solid #B8D2E2;background:#F8FCFF;color:var(--ink);border-radius:12px;font-size:16px;outline:none}input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #F58D2723}
button,.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.secondary,button.secondary{background:#fff;color:var(--blue);border:1px solid #9FC5DA}.btn.orange,button.orange{background:var(--orange)}button.danger,.btn.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{min-height:24px;margin-top:10px;font-weight:800}.msg.ok{color:var(--ok)}.msg.err{color:var(--danger)}.muted{color:var(--muted);line-height:1.8}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.room{background:var(--soft);border:1px solid var(--line);border-radius:17px;padding:16px}.room h3{margin:0 0 4px}.roomCode{font-size:24px;font-weight:1000;letter-spacing:.1em;color:var(--orange);direction:ltr;text-align:right}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{font-size:12px;font-weight:900;border-radius:999px;padding:5px 9px;background:#EAF4FA;color:var(--blue)}.badge.private{background:#FFF0E2;color:#A6560C}.empty{border:1px dashed #B8D2E2;border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sectionHead h2{margin:0}.users{display:grid;gap:10px}.user{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.user strong{font-size:18px}.status{font-weight:900}.status.approved{color:var(--ok)}.status.pending{color:var(--orange)}.status.rejected,.status.disabled{color:var(--danger)}
.packGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pack{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:14px}.packReady{color:var(--ok);font-weight:900}.packMissing{color:var(--danger);font-weight:900}.divider{height:1px;background:#D9E7EF;margin:20px 0}.permission{max-width:720px;margin:40px auto;text-align:center}
.accountBox{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.accountItem{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:15px}.accountItem span{display:block;color:var(--muted);font-size:13px;font-weight:800}.accountItem b{display:block;margin-top:5px;overflow-wrap:anywhere}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.packGrid{grid-template-columns:1fr 1fr}.navUser .role{display:none}}
@media(max-width:700px){.navInner{padding:8px 10px;gap:7px}.navBrand img{width:92px;height:42px}.navLink{padding:9px 11px}.navUser{display:none}.page{padding:20px 12px 42px}.pageHead{align-items:flex-start;flex-direction:column}.grid2,.rooms,.user,.accountBox{grid-template-columns:1fr}.packGrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.card{padding:16px}}
</style>
</head>
<body>
<header class="adminNav">
  <div class="navInner">
    <a class="navBrand" href="/admin/dashboard"><img src="/brand.webp" alt="الثلاثية الثقافية"></a>
    <nav class="navScroll" aria-label="أقسام الإدارة">
      <a class="navLink" data-page="dashboard" href="/admin/dashboard">الرئيسية</a>
      <a class="navLink" data-page="rooms" href="/admin/rooms">الغرف</a>
      <a id="accountsNav" class="navLink hidden" data-page="accounts" href="/admin/accounts">الحسابات</a>
      <a class="navLink" data-page="archive" href="/admin/archive">الأرشيف</a>
      <a class="navLink" data-page="settings" href="/admin/settings">الإعدادات</a>
    </nav>
    <div class="navUser"><span id="navRole" class="role"></span><button id="logoutMini" class="logoutMini">خروج</button></div>
  </div>
</header>
<main class="page">
  <div id="root"><div class="card">جاري تحميل لوحة الإدارة…</div></div>
</main>
<script>
const $=id=>document.getElementById(id),root=$('root');let USER=null,ROOMS=[],PACKS=[],USERS=[];
const page=(location.pathname.split('/').filter(Boolean)[1]||'dashboard').toLowerCase();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function roleAr(r){return r==='super_admin'?'مسؤول رئيسي':r==='assistant_admin'?'مسؤول مساعد':'مشرف'}
async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',...opt});let d={};try{d=await r.json()}catch{}return {r,d}}
async function post(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
function setMsg(id,d){const e=$(id);if(!e)return;e.textContent=d.message||'';e.className='msg '+(d.ok?'ok':'err')}
function nav(){document.querySelectorAll('.navLink').forEach(a=>a.classList.toggle('active',a.dataset.page===page));$('navRole').textContent=roleAr(USER.role);$('accountsNav').classList.toggle('hidden',USER.role!=='super_admin')}
function head(title,desc,extra=''){return '<div class="pageHead"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+extra+'</div>'}
function roomCard(r,archived=false){const privateBadge=r.is_private?'<span class="badge private">🔒 مهرجان خاص</span>':'';const owner=r.owner_name?'<span class="badge">'+esc(r.owner_name)+'</span>':'';const pack=r.is_private&&r.question_pack_label?'<div class="muted">'+esc(r.question_pack_label)+' · إصدار '+Number(r.question_pack_version||1)+'</div>':'';const url=archived?'/admin/archive/room?code='+encodeURIComponent(r.code):'/admin/room?code='+encodeURIComponent(r.code);return '<article class="room"><div class="roomCode">'+esc(r.code)+'</div><h3>'+esc(r.name)+'</h3><div class="badges">'+privateBadge+owner+'<span class="badge">'+esc(r.phase_ar)+'</span></div>'+pack+'<div class="muted">'+Number(r.team_count||0)+' فريقًا</div><div class="actions"><a class="btn" href="'+url+'">'+(archived?'فتح السجل':'إدارة الغرفة')+'</a><a class="btn secondary" target="_blank" href="/display?code='+encodeURIComponent(r.code)+'">شاشة العرض</a></div></article>'}
async function loadRooms(){const {r,d}=await api('/api/admin/rooms');if(!r.ok){if(r.status===401)return location.href='/admin';throw new Error(d.message||'تعذر تحميل الغرف')}ROOMS=d.rooms||[];return ROOMS}
async function loadPacks(){const {r,d}=await api('/api/admin/question-packs');if(!r.ok){PACKS=[];return PACKS}PACKS=d.slots||[];return PACKS}
async function renderDashboard(){await loadRooms();const active=ROOMS.filter(r=>!r.is_archived),arch=ROOMS.filter(r=>r.is_archived),priv=ROOMS.filter(r=>r.is_private),teams=active.reduce((n,r)=>n+Number(r.team_count||0),0);root.innerHTML=head('لوحة الإدارة','نظرة سريعة على حالة منصة الخزنة.')+'<section class="stats"><div class="stat"><span>الغرف النشطة</span><b>'+active.length+'</b></div><div class="stat"><span>الفرق داخل النشط</span><b>'+teams+'</b></div><div class="stat"><span>الغرف الخاصة</span><b>'+priv.length+'</b></div><div class="stat"><span>في الأرشيف</span><b>'+arch.length+'</b></div></section><section class="card"><div class="sectionHead"><h2>أحدث الغرف النشطة</h2><a class="btn secondary" href="/admin/rooms">عرض كل الغرف</a></div><div class="rooms">'+(active.slice(0,4).map(r=>roomCard(r)).join('')||'<div class="empty">لا توجد غرف نشطة حاليًا.</div>')+'</div></section>'}
function packOptions(){return PACKS.filter(p=>p.ready).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.label)+' — إصدار '+Number(p.version||1)+'</option>').join('')}
async function renderRooms(){await loadRooms();const privileged=['super_admin','assistant_admin'].includes(USER.role);if(privileged)await loadPacks();const active=ROOMS.filter(r=>!r.is_archived&&!r.is_private),privateActive=ROOMS.filter(r=>!r.is_archived&&r.is_private);root.innerHTML=head('الغرف','إنشاء وإدارة الغرف من صفحة واحدة مخصصة.')+'<section class="card"><h2>إنشاء غرفة عادية</h2><div class="grid2"><input id="roomName" maxlength="80" placeholder="اسم الغرفة — مثال: الغرفة الأولى"><button id="createRoom" class="orange">إنشاء الغرفة</button></div><div id="roomMsg" class="msg"></div></section><section class="card"><div class="sectionHead"><h2>الغرف العادية الحالية</h2><button id="refreshRooms" class="secondary">تحديث</button></div><div id="normalRooms" class="rooms">'+(active.map(r=>roomCard(r)).join('')||'<div class="empty">لا توجد غرف عادية نشطة.</div>')+'</div></section>'+(privileged?'<section class="card"><h2>غرفة مهرجان خاصة</h2><p class="muted">تظهر للمسؤول الرئيسي والمسؤول المساعد فقط، وترتبط بنسخة ثابتة من ملف الجولة.</p><div class="grid2"><input id="privateRoomName" maxlength="80" placeholder="اسم الغرفة الخاصة"><select id="questionPack"><option value="">اختر ملف الجولة</option>'+packOptions()+'</select></div><div class="actions"><button id="createPrivate" class="orange">إنشاء غرفة خاصة</button></div><div id="privateMsg" class="msg"></div><div class="divider"></div><h3>الغرف الخاصة الحالية</h3><div class="rooms">'+(privateActive.map(r=>roomCard(r)).join('')||'<div class="empty">لا توجد غرف خاصة نشطة.</div>')+'</div></section>':'')+(USER.role==='super_admin'?packAdminHtml():'');$('createRoom').onclick=createNormal;$('refreshRooms').onclick=renderRooms;if(privileged)$('createPrivate').onclick=createPrivate;if(USER.role==='super_admin')bindPackInputs()}
function packAdminHtml(){return '<section class="card"><div class="sectionHead"><div><h2>ملفات أسئلة المهرجان</h2><div class="muted">رفع أو استبدال ملفات الجولات. الغرف المنشأة سابقًا لا تتغير.</div></div></div><div class="packGrid">'+PACKS.map(p=>'<article class="pack"><b>'+esc(p.label)+'</b><div class="'+(p.ready?'packReady':'packMissing')+'">'+(p.ready?'جاهز · إصدار '+Number(p.version||1):'غير مرفوع')+'</div><div class="muted">'+(p.source_name?esc(p.source_name):'—')+'</div><div class="actions"><input id="file_'+esc(p.id)+'" type="file" accept=".json,application/json" style="padding:9px"><button data-pack="'+esc(p.id)+'" class="secondary uploadPack">رفع / استبدال</button></div></article>').join('')+'</div><div id="packMsg" class="msg"></div></section>'}
function bindPackInputs(){document.querySelectorAll('.uploadPack').forEach(b=>b.onclick=()=>uploadPack(b.dataset.pack))}
async function createNormal(){const {r,d}=await post('/api/admin/create_room',{room_name:$('roomName').value.trim(),room_type:'normal'});setMsg('roomMsg',d);if(r.ok)location.href='/admin/room?code='+encodeURIComponent(d.room.code)}
async function createPrivate(){const {r,d}=await post('/api/admin/create_room',{room_name:$('privateRoomName').value.trim(),room_type:'private',question_pack_id:$('questionPack').value});setMsg('privateMsg',d);if(r.ok)location.href='/admin/room?code='+encodeURIComponent(d.room.code)}
async function uploadPack(id){const input=$('file_'+id),file=input&&input.files&&input.files[0];if(!file){setMsg('packMsg',{ok:false,message:'اختر ملف JSON أولًا.'});return}let payload;try{payload=JSON.parse(await file.text())}catch{setMsg('packMsg',{ok:false,message:'ملف JSON غير صالح.'});return}const {r,d}=await post('/api/admin/question-packs/upload',{slot_id:id,payload,source_name:file.name});setMsg('packMsg',d);if(r.ok)setTimeout(renderRooms,300)}
async function renderAccounts(){if(USER.role!=='super_admin'){root.innerHTML='<section class="card permission"><h2>هذه الصفحة للمسؤول الرئيسي فقط</h2><p class="muted">حسابك لا يملك صلاحية إدارة الحسابات.</p><a class="btn" href="/admin/dashboard">العودة للرئيسية</a></section>';return}const {r,d}=await api('/api/admin/users');if(!r.ok)throw new Error(d.message||'تعذر تحميل الحسابات');USERS=d.users||[];root.innerHTML=head('الحسابات','اعتماد المشرفين وتحديد المسؤول المساعد وإدارة حالة الحسابات.')+'<section class="card"><div class="sectionHead"><h2>الحسابات المسجلة</h2><button id="refreshUsers" class="secondary">تحديث</button></div><div class="users">'+USERS.map(userHtml).join('')+'</div><div id="usersMsg" class="msg"></div></section>';$('refreshUsers').onclick=renderAccounts;document.querySelectorAll('[data-user-action]').forEach(b=>b.onclick=()=>userAction(b.dataset.userAction,b.dataset.user,b.dataset.role||''))}
function userHtml(u){const mine=u.id===USER.id;if(u.role==='super_admin')return '<article class="user"><div><strong>'+esc(u.name)+'</strong><div class="muted">'+esc(u.email)+'</div><div class="status approved">مسؤول رئيسي</div></div><span class="badge">الحساب الرئيسي</span></article>';let buttons='';if(u.status==='pending')buttons+='<button data-user-action="approve" data-user="'+u.id+'">اعتماد</button><button class="danger" data-user-action="reject" data-user="'+u.id+'">رفض</button>';if(u.status==='approved'){buttons+='<button class="secondary" data-user-action="role" data-role="'+(u.role==='assistant_admin'?'supervisor':'assistant_admin')+'" data-user="'+u.id+'">'+(u.role==='assistant_admin'?'تحويل إلى مشرف':'تعيين مسؤول مساعد')+'</button><button class="danger" data-user-action="disable" data-user="'+u.id+'">إيقاف</button>'}if(['disabled','rejected'].includes(u.status))buttons+='<button data-user-action="approve" data-user="'+u.id+'">إعادة اعتماد</button>';buttons+='<button class="secondary" data-user-action="delete" data-user="'+u.id+'">حذف</button>';return '<article class="user"><div><strong>'+esc(u.name)+'</strong><div class="muted">'+esc(u.email)+'</div><div class="status '+esc(u.status)+'">'+roleAr(u.role)+' · '+esc(u.status)+'</div></div><div class="actions">'+buttons+'</div></article>'}
async function userAction(action,id,role){let path='/api/admin/users/'+action,body={user_id:id};if(action==='role'){path='/api/admin/users/set-role';body.role=role}if(action==='delete'&&!confirm('حذف هذا الحساب؟ ستبقى سجلات غرفه السابقة محفوظة.'))return;const {r,d}=await post(path,body);setMsg('usersMsg',d);if(r.ok)setTimeout(renderAccounts,250)}
async function renderArchive(){await loadRooms();const archived=ROOMS.filter(r=>r.is_archived),normal=archived.filter(r=>!r.is_private),priv=archived.filter(r=>r.is_private);root.innerHTML=head('الأرشيف','الغرف المنتهية أو المغلقة محفوظة مع نتائجها وسجل الأحداث الكامل.')+'<section class="card"><h2>الغرف العادية</h2><div class="rooms">'+(normal.map(r=>roomCard(r,true)).join('')||'<div class="empty">لا توجد غرف عادية مؤرشفة.</div>')+'</div></section>'+(['super_admin','assistant_admin'].includes(USER.role)?'<section class="card"><h2>غرف المهرجان الخاصة</h2><div class="rooms">'+(priv.map(r=>roomCard(r,true)).join('')||'<div class="empty">لا توجد غرف خاصة مؤرشفة.</div>')+'</div></section>':'')}
function renderSettings(){root.innerHTML=head('الإعدادات','معلومات حسابك وإعدادات الجلسة الحالية.')+'<section class="card"><h2>الحساب</h2><div class="accountBox"><div class="accountItem"><span>الاسم</span><b>'+esc(USER.name)+'</b></div><div class="accountItem"><span>البريد الإلكتروني</span><b>'+esc(USER.email)+'</b></div><div class="accountItem"><span>الصلاحية</span><b>'+roleAr(USER.role)+'</b></div><div class="accountItem"><span>حالة الحساب</span><b>'+esc(USER.status)+'</b></div></div><div class="actions"><button id="settingsLogout" class="danger">تسجيل الخروج</button><a class="btn secondary" href="/">صفحة دخول الفرق</a></div></section>';$('settingsLogout').onclick=logout}
async function logout(){await post('/api/auth/logout',{});location.href='/admin'}
async function boot(){const {r,d}=await api('/api/auth/status');if(!r.ok||!d.logged_in){location.href='/admin';return}USER=d.user;nav();$('logoutMini').onclick=logout;try{if(page==='dashboard')await renderDashboard();else if(page==='rooms')await renderRooms();else if(page==='accounts')await renderAccounts();else if(page==='archive')await renderArchive();else if(page==='settings')renderSettings();else location.replace('/admin/dashboard')}catch(e){root.innerHTML='<section class="card"><h2>تعذر تحميل الصفحة</h2><p class="muted">'+esc(e.message||e)+'</p><button onclick="location.reload()">إعادة المحاولة</button></section>'}}
boot();
</script>
</body></html>

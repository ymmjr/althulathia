</style><style id="official-althulathia-theme">
:root{--deep:#F4F9FC;--green:#1066AB;--green2:#0D78B9;--gold:#F58D27;--paper:#FFFFFF;--ink:#083C61;--muted:#638398}
body{background:linear-gradient(145deg,#F8FCFE 0,#EAF4FA 100%)!important;color:#083C61!important}
img[src="/brand.webp"]{width:min(340px,82vw)!important;border-radius:0!important}
.brand{padding-top:28px!important}.tag{color:#F58D27!important}.brand h1{color:#1066AB!important}.brand p,.adminlink,.foot{color:#638398!important}
.panel{background:#fff!important;color:#083C61!important;border-color:#C8DDE9!important;box-shadow:0 20px 55px #0b5f9420!important}
input{background:#F8FCFF!important;color:#083C61!important;border-color:#B8D2E2!important}input:focus{border-color:#F58D27!important}
button{background:#1066AB!important;color:#fff!important}.error{color:#C94B45!important}.ok{color:#2B9B67!important}</style></head><body><main class="wrap"><div style="margin-bottom:18px"><img src="/brand.webp" alt="الثلاثية الثقافية" style="width:min(360px,82vw);border-radius:18px"></div><section class="brand"><div class="tag">الثلاثية الثقافية</div><h1>الخزنة</h1><p>أدخل رمز الغرفة واسم فريقك. كل غرفة تستقبل عددًا ديناميكيًا من الفرق ولا توجد فرق ثابتة مسبقًا.</p></section><section class="panel"><h2>دخول فريق</h2><div class="field"><label for="code">رمز الغرفة</label><input id="code" maxlength="4" autocomplete="off" placeholder="مثال: K7M4"></div><div class="field"><label for="teamName">اسم الفريق</label><input id="teamName" maxlength="80" autocomplete="off" placeholder="مثال: الصقور"></div><button id="join">دخول الغرفة</button><div id="msg" class="msg"></div></section><a class="adminlink" href="/admin">← دخول المشرف</a><div class="foot">__VERSION__ · السلوك المرجعي: إصدار الخزنة 1.31</div></main><script>
const $=id=>document.getElementById(id),msg=$('msg');$('code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4));async function join(){const code=$('code').value.trim().toUpperCase(),teamName=$('teamName').value.trim();msg.className='msg';msg.textContent='';if(code.length!==4){msg.classList.add('error');msg.textContent='أدخل رمز الغرفة المكوّن من 4 خانات.';return}if(!teamName){msg.classList.add('error');msg.textContent='اكتب اسم الفريق.';return}const key='vault_team_'+code,existing=localStorage.getItem(key)||'';$('join').disabled=true;try{const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,team_name:teamName,existing_token:existing})}),d=await r.json();if(!d.ok){msg.classList.add('error');msg.textContent=d.message||'تعذر الدخول.';return}localStorage.setItem(key,d.team_token);msg.classList.add('ok');msg.textContent='تم الدخول ✓';location.href=d.team_url}catch(e){msg.classList.add('error');msg.textContent='تعذر الاتصال بالسيرفر.'}finally{$('join').disabled=false}}$('join').onclick=join;[$('code'),$('teamName')].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')join()}));
</script></body></html>

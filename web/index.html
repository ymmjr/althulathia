<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخزنة — دخول الفرق</title><style>
:root{font-family:Tahoma,Arial,sans-serif;--deep:#071914;--green:#123e35;--green2:#1f5d4c;--gold:#e1bd5b;--paper:#f3f0e7;--ink:#123e35;--muted:#6e7c76}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#24564c,#071914 58%);color:#fff;padding:24px}.wrap{max-width:980px;margin:auto}.brand{padding:55px 0 28px}.tag{font-weight:900;color:var(--gold);letter-spacing:.07em}.brand h1{font-size:clamp(48px,8vw,92px);margin:6px 0}.brand p{max-width:700px;color:#cadbd6;font-size:19px;line-height:1.9}.panel{background:#fff;color:var(--ink);border-radius:28px;padding:28px;box-shadow:0 25px 70px #0006;max-width:720px}.panel h2{font-size:30px;margin:0 0 18px}.field{margin:14px 0}label{display:block;font-weight:900;margin-bottom:8px}input{width:100%;padding:17px 18px;border:2px solid #b9c5bf;border-radius:15px;font-size:21px;outline:none;text-align:right}input:focus{border-color:var(--green2)}#code{text-transform:uppercase;letter-spacing:.12em;font-weight:1000;text-align:center;font-size:30px}button{width:100%;border:0;border-radius:15px;padding:18px;font-size:21px;font-weight:1000;background:var(--green);color:#fff;cursor:pointer;margin-top:8px}button:disabled{opacity:.5}.msg{min-height:30px;margin-top:14px;font-weight:800}.error{color:#a83225}.ok{color:#1f6b4f}.adminlink{display:inline-block;margin-top:18px;color:#d9e6e1;text-decoration:none;font-weight:800}.foot{margin-top:26px;color:#9eb6af;font-size:13px}@media(max-width:700px){body{padding:16px}.brand{padding-top:24px}.panel{padding:20px}}
</style></head><body><main class="wrap"><section class="brand"><div class="tag">الثلاثية الثقافية · WEB PILOT</div><h1>الخزنة</h1><p>أدخل رمز الغرفة واسم فريقك. كل غرفة تستقبل عددًا ديناميكيًا من الفرق ولا توجد فرق ثابتة مسبقًا.</p></section><section class="panel"><h2>دخول فريق</h2><div class="field"><label for="code">رمز الغرفة</label><input id="code" maxlength="4" autocomplete="off" placeholder="مثال: K7M4"></div><div class="field"><label for="teamName">اسم الفريق</label><input id="teamName" maxlength="80" autocomplete="off" placeholder="مثال: الصقور"></div><button id="join">دخول الغرفة</button><div id="msg" class="msg"></div></section><a class="adminlink" href="/admin">دخول المشرف ←</a><div class="foot">__VERSION__ · السلوك المرجعي: Vault v1.31</div></main><script>
const $=id=>document.getElementById(id),msg=$('msg');$('code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4));async function join(){const code=$('code').value.trim().toUpperCase(),teamName=$('teamName').value.trim();msg.className='msg';msg.textContent='';if(code.length!==4){msg.classList.add('error');msg.textContent='أدخل رمز الغرفة المكوّن من 4 خانات.';return}if(!teamName){msg.classList.add('error');msg.textContent='اكتب اسم الفريق.';return}const key='vault_team_'+code,existing=localStorage.getItem(key)||'';$('join').disabled=true;try{const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,team_name:teamName,existing_token:existing})}),d=await r.json();if(!d.ok){msg.classList.add('error');msg.textContent=d.message||'تعذر الدخول.';return}localStorage.setItem(key,d.team_token);msg.classList.add('ok');msg.textContent='تم الدخول ✓';location.href=d.team_url}catch(e){msg.classList.add('error');msg.textContent='تعذر الاتصال بالسيرفر.'}finally{$('join').disabled=false}}$('join').onclick=join;[$('code'),$('teamName')].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')join()}));
</script></body></html>

:root{font-family:Tahoma,Arial,sans-serif;--green:#334CE0;--gold:#F4D126;--paper:#080B2A;--red:#EF5E74;--purple:#8B5CF6;--cyan:#17C9D8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% -10%,#29225c 0,var(--paper) 45%);padding:18px;color:#F7F8FF}.card{width:min(800px,100%);margin:12px auto;background:#11163A;border:1px solid #2B3367;border-radius:28px;padding:24px;box-shadow:0 18px 55px #0005}.header{display:flex;justify-content:space-between;gap:12px;align-items:center}.teamName{font-size:24px;font-weight:1000}.room{font-size:15px;color:#AEB6DC}.pill{background:var(--green);color:#fff;border-radius:999px;padding:8px 14px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#0D1233;border-radius:14px;padding:12px;text-align:center;color:#AEB6DC}.stat b{display:block;color:var(--green);font-size:28px}.timer{font-size:58px;font-weight:1000;text-align:center;color:var(--red);margin:12px 0}.question{font-size:clamp(26px,5vw,44px);line-height:1.5;text-align:center;min-height:130px;display:flex;align-items:center;justify-content:center;margin:18px 0}input{width:100%;font-size:22px;padding:18px;border-radius:16px;border:1px solid #3a4486;background:#0C1030;color:#fff;outline:none;text-align:right}input:disabled{background:#171D49}button{width:100%;margin-top:14px;border:0;border-radius:16px;padding:18px;font-size:21px;font-weight:1000;background:var(--green);color:#fff;cursor:pointer}button:disabled{opacity:.45}.msg{text-align:center;font-size:22px;line-height:1.8;min-height:82px;padding:20px}.risk{font-size:36px;font-weight:1000;color:var(--red);text-align:center}.hidden{display:none!important}.small{text-align:center;color:#AEB6DC;font-size:13px;margin-top:16px}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:23px}.card{padding:18px}}
</style><style id="official-althulathia-theme">
:root{--green:#1066AB;--gold:#F58D27;--paper:#F4F9FC;--red:#C94B45;--purple:#1066AB;--cyan:#F58D27}
body{background:linear-gradient(145deg,#F8FCFE 0,#EAF4FA 100%)!important;color:#083C61!important}
img[src="/brand.webp"]{width:min(300px,75vw)!important;border-radius:0!important}
.card{background:#fff!important;color:#083C61!important;border:1px solid #C8DDE9!important;box-shadow:0 18px 50px #0b5f9420!important}
.pill{background:#EAF4FA!important;color:#1066AB!important;border-color:#BDD8E7!important}
.stat{background:#F4F9FC!important;border-color:#D4E6EF!important}.stat b{color:#1066AB!important}
.timer{color:#F58D27!important}.question{color:#083C61!important}
input{background:#F8FCFF!important;color:#083C61!important;border-color:#B8D2E2!important}input:focus{border-color:#F58D27!important}

.msg,.small,.room{color:#638398!important}.risk{color:#F58D27!important}</style></head><body><div style="max-width:720px;margin:14px auto 0;padding:0 14px"><img src="/brand.webp" alt="الثلاثية الثقافية" style="width:min(310px,75vw);border-radius:16px"></div><main class="card"><header class="header"><div><div id="teamName" class="teamName">...</div><div id="room" class="room">...</div></div><div class="pill">الخزنة</div></header><section class="stats"><div class="stat">الخزنة<b id="vault">0</b></div><div class="stat">المعرّض للخطر<b id="risk">0</b></div><div class="stat">قيمة السؤال القادم<b id="value">1</b></div></section><div id="questionArea" class="hidden"><div id="timer" class="timer">10</div><div id="question" class="question"></div><input id="answer" autocomplete="off" maxlength="500" placeholder="اكتب إجابتك هنا"><button id="send">إرسال الإجابة</button></div><div id="storageArea" class="hidden"><div id="storageTimer" class="timer">5</div><div class="msg">إجابة صحيحة ✅</div><div class="risk">المعرّض للخطر: <span id="riskValue">0</span></div><button id="store">🔒 تخزين</button></div><div id="message" class="msg">جاري الدخول...</div><div class="small">الإرسال يقفل الإجابة. إذا انتهى الوقت قبل الإرسال يعتمد النظام آخر نص كتبته تلقائيًا.</div></main><script>
const qs=new URLSearchParams(location.search),CODE=(qs.get('code')||'').toUpperCase(),TOKEN=qs.get('token')||'';let state=null,offset=0,samples=[],lastQuestionToken=-1,sentLocal=false,storedLocal=false,draftRevision=0,draftTimer=null,lastDraftSent='';const $=id=>document.getElementById(id),origin=performance.timeOrigin||(Date.now()-performance.now());function nowServer(){return origin+performance.now()+offset}function left(d){return Math.max(0,Math.ceil((Number(d||0)-nowServer())/1000))}function sync(server,t0,t1){const s={rtt:t1-t0,offset:Number(server)-(origin+(t0+t1)/2)};samples.push(s);if(samples.length>16)samples.shift();const best=samples.reduce((a,b)=>b.rtt<a.rtt?b:a,samples[0]);offset=samples.length===1?best.offset:offset*.65+best.offset*.35}async function post(path,obj){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...obj,code:CODE,team_token:TOKEN})});const d=await r.json();if(!d.ok)throw new Error(d.message||'تعذر تنفيذ العملية');return d}async function sendDraftNow(){if(!state||state.phase!=='question_open'||state.team.submitted||sentLocal)return;const text=$('answer').value;if(text===lastDraftSent)return;lastDraftSent=text;try{await post('/api/team/draft',{draft:text,revision:++draftRevision,question_token:state.question_token})}catch(e){}}$('answer').addEventListener('input',()=>{if(draftTimer)clearTimeout(draftTimer);draftTimer=setTimeout(sendDraftNow,180)});async function getState(){try{const t0=performance.now(),r=await fetch('/api/team/state?code='+encodeURIComponent(CODE)+'&token='+encodeURIComponent(TOKEN),{cache:'no-store'}),d=await r.json(),t1=performance.now();if(!r.ok){$('message').textContent=d.message||'تعذر فتح جلسة الفريق.';return}sync(d.server_now_ms,t0,t1);state=d;render()}catch(e){$('message').textContent='تعذر الاتصال بالسيرفر...'}}function render(){if(!state)return;const t=state.team;$('teamName').textContent=t.name;$('room').textContent=state.room_name+' · '+state.room_code+' · '+state.team_count+' فريقًا';$('vault').textContent=t.vault;$('risk').textContent=t.risk;$('value').textContent=t.value;$('questionArea').classList.add('hidden');$('storageArea').classList.add('hidden');$('message').classList.remove('hidden');if(state.room_closed){$('message').textContent='تم إغلاق هذه الغرفة ونقلها إلى السجل.\nلا توجد تفاعلات متاحة الآن.';return}if(state.phase==='lobby'){$('message').textContent='تم تسجيل فريقك ✓\nبانتظار المشرف لبدء الجولة.';return}if(state.phase==='question_open'){if(state.question_token!==lastQuestionToken){lastQuestionToken=state.question_token;sentLocal=t.submitted;storedLocal=false;draftRevision=0;lastDraftSent='';$('answer').value='';$('answer').disabled=false;$('send').disabled=false}$('questionArea').classList.remove('hidden');$('message').classList.add('hidden');$('question').textContent=state.question;const sec=left(state.question_deadline_ms);$('timer').textContent=sec;const done=t.submitted||sentLocal;$('answer').disabled=done;$('send').disabled=done;$('send').textContent=done?'تم الإرسال ✓ — الإجابة مقفلة':'إرسال الإجابة';if(sec<=1&&!done&&$('answer').value!==lastDraftSent)sendDraftNow();if(sec<=0&&!done){sendDraftNow();$('answer').disabled=true;$('send').disabled=true}return}if(state.phase==='waiting_correction'){$('message').textContent=t.submitted?'تم إرسال الإجابة وقفلها ✓\nبانتظار التصحيح...':t.auto_finalized?'تم اعتماد آخر كتابة تلقائيًا ✓\nبانتظار التصحيح...':'انتهى الوقت — لم تُسجل إجابة.';return}if(state.phase==='storage_open'){if(t.correction===true){$('storageArea').classList.remove('hidden');$('message').classList.add('hidden');$('riskValue').textContent=t.risk;$('storageTimer').textContent=left(state.storage_deadline_ms);const done=t.decision==='store'||storedLocal;$('store').disabled=done;$('store').textContent=done?'تم تسجيل التخزين ✓':'🔒 تخزين'}else $('message').textContent='الإجابة خاطئة ❌\nانتظر انتهاء مرحلة التخزين.';return}if(state.phase==='resolved'){$('message').textContent=t.correction===false?'إجابة خاطئة ❌ — فقدت النقاط غير المخزنة.':t.decision==='store'?'تم التخزين 🔒':'تمت المخاطرة 🔥';return}if(state.phase==='finished'){$('message').textContent='انتهت فقرة الخزنة.\nرصيد خزنتك النهائي: '+t.vault;return}$('message').textContent='بانتظار المشرف...'}$('send').onclick=async()=>{if(!state||state.phase!=='question_open'||state.team.submitted||sentLocal)return;const answer=$('answer').value.trim();if(!answer){$('answer').focus();return}if(draftTimer)clearTimeout(draftTimer);$('send').disabled=true;try{await post('/api/team/answer',{answer});sentLocal=true;lastDraftSent=answer;$('answer').disabled=true;$('send').textContent='تم الإرسال ✓ — الإجابة مقفلة'}catch(e){$('send').disabled=false;alert(e.message)}getState()};$('store').onclick=async()=>{if(!state||state.phase!=='storage_open')return;$('store').disabled=true;try{await post('/api/team/storage',{});storedLocal=true;$('store').textContent='تم تسجيل التخزين ✓'}catch(e){$('store').disabled=false;alert(e.message)}getState()};function startStream(){const url='/api/team/stream?code='+encodeURIComponent(CODE)+'&token='+encodeURIComponent(TOKEN),es=new EventSource(url);es.addEventListener('state',e=>{try{const d=JSON.parse(e.data),t=performance.now();sync(d.server_now_ms,t,t);state=d;render()}catch(_){}});es.onerror=()=>{if(!state)$('message').textContent='إعادة الاتصال بالسيرفر…'}}setInterval(()=>{if(state)render()},50);getState().then(startStream);setInterval(getState,30000);
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/webp" href="/brand.webp">
<link rel="apple-touch-icon" href="/brand.webp">
<meta name="theme-color" content="#1066AB">
<title>الخزنة — فريق</title>
<style>
:root{font-family:"Segoe UI",Tahoma,Arial,sans-serif;--blue:#1066AB;--blue2:#1789D8;--orange:#F58D27;--ink:#082F52;--muted:#69869A;--line:#D3E4ED;--soft:#F8FCFF;--ok:#25A56E;--danger:#D64E4A}
*{box-sizing:border-box}.hidden{display:none!important}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#F9FCFE 0,#EDF6FB 100%);color:var(--ink);padding:16px;position:relative}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1}
body:before{width:230px;height:230px;right:-90px;top:0;background:linear-gradient(135deg,#1066AB22,#2F9EE410);clip-path:polygon(100% 0,0 0,100% 100%)}
body:after{width:200px;height:200px;left:-80px;bottom:0;background:linear-gradient(135deg,#F58D2730,#FFB46C10);clip-path:polygon(0 100%,100% 100%,0 0)}
.shell{width:min(760px,100%);margin:auto}.brandWrap{display:flex;justify-content:center;margin:4px 0 11px}.brand{width:min(205px,52vw);height:92px;object-fit:contain}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 46px rgba(12,89,138,.12);overflow:hidden}
.header{padding:16px 18px;background:linear-gradient(135deg,#0A5D9D,#1685D2);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.header:after{content:"";position:absolute;width:100px;height:100px;left:-35px;top:-35px;background:#ffffff0e;transform:rotate(45deg)}
.teamName{font-size:23px;font-weight:1000}.room{font-size:13px;color:#D7EDF8;margin-top:3px}.pill{background:#ffffff18;border:1px solid #ffffff32;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:13px 13px 0}.stat{background:#F6FAFD;border:1px solid #DCEAF1;border-radius:14px;padding:10px 5px;text-align:center;color:var(--muted);font-size:12px;font-weight:800}.stat b{display:block;color:var(--ink);font-size:25px;margin-top:3px}.stat.riskStat b{color:var(--danger)}.stat.valueStat b{color:var(--orange)}
.phaseBar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 15px;margin:13px;border-radius:13px;background:#EFF7FB;border:1px solid #D7E7F0}.phaseTag{font-size:12px;font-weight:900;color:var(--blue)}.qMeta{color:var(--muted);font-size:12px;font-weight:800}
.questionArea,.storageArea{padding:0 15px 17px}.questionTop{display:flex;justify-content:center;align-items:center;margin:4px 0 12px}.timerHero{width:min(360px,100%);display:grid;place-items:center;gap:2px;background:linear-gradient(135deg,#FFF4E8,#FFE8D2);color:#9A550F;border:2px solid #F3C18F;border-radius:18px;padding:12px 18px;box-shadow:0 10px 24px rgba(245,141,39,.12);transition:.18s ease}.timerHeroLabel{font-size:13px;font-weight:900}.timer{font-size:clamp(50px,12vw,74px);font-weight:1000;line-height:1;direction:ltr;unicode-bidi:isolate;letter-spacing:.04em}.timerHero.urgent{background:linear-gradient(135deg,#FFF0ED,#FFE2DC);color:#B13D34;border-color:#E9A39B;box-shadow:0 10px 26px rgba(214,78,74,.16)}
.question{background:#FBFDFF;border:1px solid #D7E7F0;border-radius:17px;min-height:125px;padding:20px 16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(23px,5.3vw,34px);line-height:1.55;font-weight:1000}
.answerWrap{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}input{min-width:0;width:100%;font-size:18px;padding:15px;border-radius:13px;border:1px solid #BBD3E1;background:#FBFDFF;color:var(--ink);outline:none;text-align:start}input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #F58D2720}input:disabled{background:#EDF3F7;color:#748C9B}
button{border:0;border-radius:13px;padding:14px 20px;font-size:17px;font-weight:1000;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;cursor:pointer;white-space:nowrap}button:disabled{opacity:.48;cursor:not-allowed}
.storageCard{background:linear-gradient(145deg,#FFF9F2,#FFF1E2);border:1px solid #F5C99F;border-radius:18px;padding:17px;text-align:center}.storageIcon{font-size:46px}.storageTitle{font-size:25px;font-weight:1000;color:#995510}.storageTimer{font-size:44px;font-weight:1000;color:var(--orange);margin:5px}.risk{font-size:18px;font-weight:900;color:#A5540B;margin:8px 0 12px}.risk span{font-size:30px}.storageCard button{width:100%;background:linear-gradient(135deg,var(--orange),#FF781F)}
.messageWrap{padding:0 15px 17px}.msg{text-align:center;font-size:22px;line-height:1.8;min-height:175px;padding:24px 15px;border:1px solid #D7E7F0;background:#FBFDFF;border-radius:17px;display:flex;align-items:center;justify-content:center;white-space:pre-line;font-weight:900}.msg:before{content:"";display:none}
.small{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;padding:0 18px 18px}
body[data-phase="lobby"] .msg{background:linear-gradient(145deg,#FBFDFF,#F0F8FC)}
body[data-phase="waiting_correction"] .msg{background:#FFF8F1;border-color:#F5D3B1;color:#8D571E}
body[data-phase="resolved"] .msg,body[data-phase="finished"] .msg{background:#F0FAF6;border-color:#BFE5D4;color:#176D4A}
@media(max-width:560px){body{padding:10px}.brand{height:72px}.header{padding:13px 14px}.teamName{font-size:20px}.stats{padding:10px 10px 0}.stat b{font-size:21px}.phaseBar{margin:10px}.questionArea,.storageArea,.messageWrap{padding-inline:10px}.question{min-height:115px;padding:17px 12px}.answerWrap{grid-template-columns:1fr}.answerWrap button{width:100%}.small{padding:0 12px 14px}}
</style>
</head>
<body>
<div class="shell">
  <div class="brandWrap"><img class="brand" src="/brand.webp" alt="الثلاثية الثقافية"></div>
  <main class="card">
    <header class="header">
      <div><div id="teamName" class="teamName">...</div><div id="room" class="room">...</div></div>
      <div class="pill">الخزنة</div>
    </header>
    <section class="stats">
      <div class="stat">الخزنة<b id="vault">0</b></div>
      <div class="stat riskStat">الخطر<b id="risk">0</b></div>
      <div class="stat valueStat">قيمة السؤال<b id="value">1</b></div>
    </section>
    <div class="phaseBar"><span id="phaseTag" class="phaseTag">بانتظار الجولة</span><span id="qMeta" class="qMeta"></span></div>

    <div id="questionArea" class="questionArea hidden">
      <div class="questionTop"><div id="timerHero" class="timerHero"><span class="timerHeroLabel">الوقت المتبقي</span><span id="timer" class="timer">15</span></div></div>
      <div id="question" class="question"></div>
      <div class="answerWrap"><input id="answer" autocomplete="off" maxlength="500" placeholder="اكتب إجابتك هنا..."><button id="send">إرسال الإجابة</button></div>
    </div>

    <div id="storageArea" class="storageArea hidden">
      <div class="storageCard">
        <div class="storageIcon">🔒</div>
        <div class="storageTitle">إجابة صحيحة</div>
        <div id="storageTimer" class="storageTimer">5</div>
        <div class="risk">النقاط المعرّضة للخطر <span id="riskValue">0</span></div>
        <button id="store">تخزين</button>
      </div>
    </div>

    <div class="messageWrap"><div id="message" class="msg">جاري الدخول...</div></div>
    <div class="small">بعد إرسال الإجابة تُقفل. وإذا انتهى الوقت قبل الإرسال يعتمد النظام آخر نص كتبته تلقائيًا.</div>
  </main>
</div>
<script>
const qs=new URLSearchParams(location.search),CODE=(qs.get('code')||'').toUpperCase(),TOKEN=qs.get('token')||'';let state=null,offset=0,samples=[],lastQuestionToken=-1,sentLocal=false,storedLocal=false,draftRevision=0,draftTimer=null,lastDraftSent='';const $=id=>document.getElementById(id),origin=performance.timeOrigin||(Date.now()-performance.now());function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nowServer(){return origin+performance.now()+offset}function left(d){return Math.max(0,Math.ceil((Number(d||0)-nowServer())/1000))}function sync(server,t0,t1){const s={rtt:t1-t0,offset:Number(server)-(origin+(t0+t1)/2)};samples.push(s);if(samples.length>16)samples.shift();const best=samples.reduce((a,b)=>b.rtt<a.rtt?b:a,samples[0]);offset=samples.length===1?best.offset:offset*.65+best.offset*.35}async function post(path,obj){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...obj,code:CODE,team_token:TOKEN})});const d=await r.json();if(!d.ok)throw new Error(d.message||'تعذر تنفيذ العملية');return d}async function sendDraftNow(){if(!state||state.phase!=='question_open'||state.team.submitted||sentLocal)return;const text=$('answer').value;if(text===lastDraftSent)return;lastDraftSent=text;try{await post('/api/team/draft',{draft:text,revision:++draftRevision,question_token:state.question_token})}catch(e){}}$('answer').addEventListener('input',()=>{if(draftTimer)clearTimeout(draftTimer);draftTimer=setTimeout(sendDraftNow,180)});async function getState(){try{const t0=performance.now(),r=await fetch('/api/team/state?code='+encodeURIComponent(CODE)+'&token='+encodeURIComponent(TOKEN),{cache:'no-store'}),d=await r.json(),t1=performance.now();if(!r.ok){$('message').textContent=d.message||'تعذر فتح جلسة الفريق.';return}sync(d.server_now_ms,t0,t1);state=d;render()}catch(e){$('message').textContent='تعذر الاتصال بالسيرفر...'}}function render(){if(!state)return;const t=state.team;document.body.dataset.phase=state.phase||'';$('teamName').textContent=t.name;$('room').innerHTML=esc(state.room_name)+' · <bdi dir="ltr">'+esc(state.room_code)+'</bdi> · '+state.team_count+' فريقًا';$('vault').textContent=t.vault;$('risk').textContent=t.risk;$('value').textContent=t.value;$('qMeta').textContent=state.question_no?('السؤال '+state.question_no+' من '+state.total_questions):'';$('phaseTag').textContent=state.phase_ar||({lobby:'بانتظار البداية',question_open:'وقت الإجابة',waiting_correction:'بانتظار التصحيح',storage_open:'وقت التخزين',resolved:'تم اعتماد النتيجة',finished:'انتهت الفقرة'}[state.phase]||'الخزنة');$('questionArea').classList.add('hidden');$('storageArea').classList.add('hidden');$('message').classList.remove('hidden');if(state.room_closed){$('message').textContent='تم إغلاق هذه الغرفة ونقلها إلى السجل.\nلا توجد تفاعلات متاحة الآن.';return}if(state.phase==='lobby'){$('message').textContent='تم تسجيل فريقك ✓\nبانتظار المشرف لبدء الجولة.';return}if(state.phase==='question_open'){if(state.question_token!==lastQuestionToken){lastQuestionToken=state.question_token;sentLocal=t.submitted;storedLocal=false;draftRevision=0;lastDraftSent='';$('answer').value='';$('answer').disabled=false;$('send').disabled=false}$('questionArea').classList.remove('hidden');$('message').classList.add('hidden');$('question').textContent=state.question;const sec=left(state.question_deadline_ms);$('timer').textContent=String(sec).padStart(2,'0');$('timerHero').classList.toggle('urgent',sec<=5);const done=t.submitted||sentLocal;$('answer').disabled=done;$('send').disabled=done;$('send').textContent=done?'تم الإرسال ✓ — الإجابة مقفلة':'إرسال الإجابة';if(sec<=1&&!done&&$('answer').value!==lastDraftSent)sendDraftNow();if(sec<=0&&!done){sendDraftNow();$('answer').disabled=true;$('send').disabled=true}return}if(state.phase==='waiting_correction'){$('message').textContent=t.submitted?'تم إرسال الإجابة وقفلها ✓\nبانتظار التصحيح...':t.auto_finalized?'تم اعتماد آخر كتابة تلقائيًا ✓\nبانتظار التصحيح...':'انتهى الوقت — لم تُسجل إجابة.';return}if(state.phase==='storage_open'){if(t.correction===true){$('storageArea').classList.remove('hidden');$('message').classList.add('hidden');$('riskValue').textContent=t.risk;$('storageTimer').textContent=left(state.storage_deadline_ms);const done=t.decision==='store'||storedLocal;$('store').disabled=done;$('store').textContent=done?'تم تسجيل التخزين ✓':'🔒 تخزين'}else $('message').textContent='الإجابة خاطئة ❌\nانتظر انتهاء مرحلة التخزين.';return}if(state.phase==='resolved'){$('message').textContent=t.correction===false?'إجابة خاطئة ❌ — فقدت النقاط غير المخزنة.':t.decision==='store'?'تم التخزين 🔒':'تمت المخاطرة 🔥';return}if(state.phase==='finished'){$('message').textContent='انتهت فقرة الخزنة.\nرصيد خزنتك النهائي: '+t.vault;return}$('message').textContent='بانتظار المشرف...'}$('send').onclick=async()=>{if(!state||state.phase!=='question_open'||state.team.submitted||sentLocal)return;const answer=$('answer').value.trim();if(!answer){$('answer').focus();return}if(draftTimer)clearTimeout(draftTimer);$('send').disabled=true;try{await post('/api/team/answer',{answer});sentLocal=true;lastDraftSent=answer;$('answer').disabled=true;$('send').textContent='تم الإرسال ✓ — الإجابة مقفلة'}catch(e){$('send').disabled=false;alert(e.message)}getState()};$('store').onclick=async()=>{if(!state||state.phase!=='storage_open')return;$('store').disabled=true;try{await post('/api/team/storage',{});storedLocal=true;$('store').textContent='تم تسجيل التخزين ✓'}catch(e){$('store').disabled=false;alert(e.message)}getState()};function startStream(){const url='/api/team/stream?code='+encodeURIComponent(CODE)+'&token='+encodeURIComponent(TOKEN),es=new EventSource(url);es.addEventListener('state',e=>{try{const d=JSON.parse(e.data),t=performance.now();sync(d.server_now_ms,t,t);state=d;render()}catch(_){}});es.onerror=()=>{if(!state)$('message').textContent='إعادة الاتصال بالسيرفر…'}}setInterval(()=>{if(state)render()},50);getState().then(startStream);setInterval(getState,30000);
</script></body></html>

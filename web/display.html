<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخزنة — شاشة العرض</title><style>
:root{font-family:Tahoma,Arial,sans-serif;--gold:#e1bd5b;--deep:#081713}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% -20%,#24564c,#081713 64%);color:#fff;height:100vh}.screen{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:3vh 4vw;gap:2vh}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:clamp(28px,3.2vw,60px);font-weight:1000}.counter{background:#ffffff12;border:1px solid #ffffff25;border-radius:999px;padding:.7em 1.2em;font-size:clamp(15px,1.5vw,27px);font-weight:900}.center{display:grid;grid-template-rows:auto 1fr auto;align-items:center;min-height:0}.timer{text-align:center;font-size:clamp(60px,8vw,138px);font-weight:1000;color:var(--gold);line-height:1;min-height:1em}.headline{text-align:center;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,4vw,68px);line-height:1.55;font-weight:1000;padding:0 4vw;overflow-wrap:anywhere}.subline{text-align:center;font-size:clamp(18px,2vw,34px);color:#c8d8d3;font-weight:800}.board{background:#ffffff0c;border:1px solid #ffffff25;border-radius:22px;padding:1.2vw 1.6vw;max-height:29vh;overflow:hidden}.boardTitle{display:flex;justify-content:space-between;color:#dfe9e5;font-weight:900;margin-bottom:8px}.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 24px}.row{display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center;border-top:1px solid #ffffff12;padding:7px 0;font-size:clamp(14px,1.3vw,23px)}.rank{color:var(--gold);font-weight:1000}.name{font-weight:900}.safe,.risk{white-space:nowrap}.risk{color:#efc179}@media(max-width:900px){.screen{padding:2vh 3vw}.rows{grid-template-columns:1fr}.board{max-height:34vh}.headline{font-size:clamp(24px,5vw,50px)}}
</style></head><body><main class="screen"><header class="top"><div class="brand">الخزنة</div><div id="counter" class="counter">بانتظار الغرفة</div></header><section class="center"><div id="timer" class="timer">0</div><div id="headline" class="headline">بانتظار البداية</div><div id="subline" class="subline"></div></section><footer class="board"><div class="boardTitle"><span>الترتيب</span><span id="count">0 فريق</span></div><div id="rows" class="rows"></div></footer></main><script>
const CODE=(new URLSearchParams(location.search).get('code')||'').toUpperCase();let state=null,offset=0,samples=[];const $=id=>document.getElementById(id),origin=performance.timeOrigin||(Date.now()-performance.now());function nowServer(){return origin+performance.now()+offset}function left(d){return Math.max(0,Math.ceil((Number(d||0)-nowServer())/1000))}function sync(server,t0,t1){const s={rtt:t1-t0,offset:Number(server)-(origin+(t0+t1)/2)};samples.push(s);if(samples.length>16)samples.shift();const best=samples.reduce((a,b)=>b.rtt<a.rtt?b:a,samples[0]);offset=samples.length===1?best.offset:offset*.65+best.offset*.35}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){if(!state)return;$('counter').textContent=(state.question_no?'السؤال '+state.question_no+' / '+state.total_questions:state.room_name+' · '+state.room_code);$('headline').textContent=state.headline;$('subline').textContent=state.subline;$('count').textContent=state.team_count+' فريقًا';$('timer').textContent=state.phase==='question_open'?left(state.question_deadline_ms):state.phase==='storage_open'?left(state.storage_deadline_ms):0;$('rows').innerHTML=state.leaderboard.map(x=>`<div class="row"><span class="rank">${x.rank}</span><span class="name">${esc(x.name)}</span><span class="safe">الخزنة ${x.vault}</span><span class="risk">خطر ${x.risk}</span></div>`).join('')||'<div>بانتظار انضمام الفرق...</div>'}async function refresh(){try{const t0=performance.now(),r=await fetch('/api/display_state?code='+encodeURIComponent(CODE),{cache:'no-store'}),d=await r.json(),t1=performance.now();if(!r.ok){$('counter').textContent='رمز غير صحيح';$('headline').textContent=d.message||'الغرفة غير موجودة';return}sync(d.server_now_ms,t0,t1);state=d;render()}catch(e){$('counter').textContent='OFFLINE'}}function startStream(){const url='/api/display_stream?code='+encodeURIComponent(CODE),es=new EventSource(url);es.addEventListener('state',e=>{try{const d=JSON.parse(e.data),t=performance.now();sync(d.server_now_ms,t,t);state=d;render()}catch(_){}});es.onerror=()=>{$('counter').textContent=state?(state.room_name+' · إعادة الاتصال…'):'إعادة الاتصال…'}}setInterval(()=>{if(state)render()},50);refresh().then(startStream);setInterval(refresh,30000);
</script></body></html>

const qs=new URLSearchParams(location.search),CODE=(qs.get('code')||'').toUpperCase();const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const r=await fetch('/api/admin/archive?code='+encodeURIComponent(CODE),{cache:'no-store'}),d=await r.json();if(!r.ok){if(r.status===401){location.href='/admin';return}$('log').textContent=d.message||'تعذر فتح السجل';return}const room=d.room;$('name').textContent=room.room_name;$('code').textContent=room.room_code;$('meta').textContent=(room.room_type==='private'?('غرفة مهرجان خاصة · '+(room.question_pack_label||'ملف خاص')+' · إصدار '+(room.question_pack_version||1)+' · '):'')+'أنشئت: '+(room.created_at||'—')+(room.closed_at?' · أغلقت إداريًا: '+room.closed_at:(room.archived_at?' · انتهت: '+room.archived_at:''));$('teams').textContent=room.team_count;$('phase').textContent=room.phase_ar;$('questions').textContent=room.total_questions;$('events').textContent=d.log_rows.length;$('xlsx').href='/api/admin/archive.xlsx?code='+encodeURIComponent(CODE);$('leader').innerHTML=(room.leaderboard||[]).length?room.leaderboard.map(t=>`<article class="rank"><b>#${t.rank} ${esc(t.name)}</b><div class="muted">الخزنة: ${t.vault} · الخطر: ${t.risk}</div></article>`).join(''):'<div class="muted">لا توجد نتائج بعد.</div>';const head=d.log_header||[],rows=d.log_rows||[];$('log').className='tableWrap';$('log').innerHTML=`<table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}load();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الثلاثية الثقافية — سجل الغرفة</title><style>
:root{font-family:Tahoma,Arial,sans-serif;--bg:#080B2A;--panel:#11163A;--panel2:#171D49;--purple:#8B5CF6;--blue:#334CE0;--cyan:#17C9D8;--yellow:#F4D126;--white:#F7F8FF;--muted:#AEB6DC;--danger:#EF5E74;--line:#2B3367}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#29225c 0,#080B2A 42%);color:var(--white);min-height:100vh;padding:18px}.wrap{max-width:1300px;margin:auto}.brand{width:min(320px,75vw);border-radius:18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:16px}.card{background:linear-gradient(180deg,#141A45,#101536);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.btn{display:inline-flex;text-decoration:none;border-radius:11px;padding:11px 15px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-weight:900}.btn.secondary{background:#1a214f;border:1px solid #3a4486}.btn.yellow{background:var(--yellow);color:#131630}.code{font-size:34px;color:var(--yellow);font-weight:1000;letter-spacing:.12em}.muted{color:var(--muted);line-height:1.8}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sum{background:#0D1233;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.sum b{display:block;font-size:28px;margin-top:5px}.leader{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rank{background:#0D1233;border:1px solid var(--line);border-radius:14px;padding:14px}.rank b{font-size:20px}.tableWrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:1100px;background:#0B1030}th,td{padding:9px 10px;border-bottom:1px solid #242c61;text-align:right;vertical-align:top;white-space:nowrap}th{position:sticky;top:0;background:#171D49;color:var(--yellow);z-index:1}td:nth-child(14),td:nth-child(17){white-space:normal;min-width:220px}.msg{padding:25px;color:var(--muted)}@media(max-width:800px){.top{flex-direction:column}.summary,.leader{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><header class="top"><img class="brand" src="/brand.svg" alt="الثلاثية الثقافية"><div><a href="/admin" class="btn secondary">رجوع للإدارة</a></div></header><section class="card"><div class="top"><div><h1 id="name" style="margin:0 0 5px">سجل الغرفة</h1><div id="meta" class="muted"></div></div><div><div id="code" class="code">----</div><a id="xlsx" class="btn yellow">تحميل Excel</a></div></div><div class="summary"><div class="sum">الفرق<b id="teams">0</b></div><div class="sum">الحالة<b id="phase" style="font-size:17px">—</b></div><div class="sum">الأسئلة<b id="questions">0</b></div><div class="sum">الأحداث<b id="events">0</b></div></div></section><section class="card"><h2>الترتيب النهائي / الحالي</h2><div id="leader" class="leader"></div></section><section class="card"><h2>سجل الأحداث الكامل</h2><div id="log" class="msg">جاري التحميل…</div></section></main><script>
const qs=new URLSearchParams(location.search),CODE=(qs.get('code')||'').toUpperCase();const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const r=await fetch('/api/admin/archive?code='+encodeURIComponent(CODE),{cache:'no-store'}),d=await r.json();if(!r.ok){if(r.status===401){location.href='/admin';return}$('log').textContent=d.message||'تعذر فتح السجل';return}const room=d.room;$('name').textContent=room.room_name;$('code').textContent=room.room_code;$('meta').textContent='أنشئت: '+(room.created_at||'—')+(room.archived_at?' · انتهت: '+room.archived_at:'');$('teams').textContent=room.team_count;$('phase').textContent=room.phase_ar;$('questions').textContent=room.total_questions;$('events').textContent=d.log_rows.length;$('xlsx').href='/api/admin/archive.xlsx?code='+encodeURIComponent(CODE);$('leader').innerHTML=(room.leaderboard||[]).length?room.leaderboard.map(t=>`<article class="rank"><b>#${t.rank} ${esc(t.name)}</b><div class="muted">الخزنة: ${t.vault} · الخطر: ${t.risk}</div></article>`).join(''):'<div class="muted">لا توجد نتائج بعد.</div>';const head=d.log_header||[],rows=d.log_rows||[];$('log').className='tableWrap';$('log').innerHTML=`<table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}load();
</script></body></html>

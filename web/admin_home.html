<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخزنة — إدارة الغرف</title><style>
:root{font-family:Tahoma,Arial,sans-serif;--green:#123e35;--gold:#e1bd5b;--bg:#eef0e7;--muted:#66746f;--danger:#a83d31}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--green);min-height:100vh;padding:22px}.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:34px}.badge{background:var(--green);color:#fff;border-radius:999px;padding:9px 15px;font-weight:900}.card{background:#fff;border:1px solid #d9ded9;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 8px 30px #0001}.grid{display:grid;grid-template-columns:1fr auto;gap:12px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.room{border:1px solid #dce2de;border-radius:18px;padding:18px}.room h3{margin:0 0 5px;font-size:23px}.code{font-size:27px;font-weight:1000;letter-spacing:.1em;color:#a57a14}.meta{color:var(--muted);line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions a{background:var(--green);color:#fff;text-decoration:none;border-radius:11px;padding:10px 14px;font-weight:900}.actions a.secondary{background:#eef3f0;color:var(--green);border:1px solid #cad8d2}input{width:100%;padding:14px;border:2px solid #bdc9c4;border-radius:12px;font-size:18px;outline:none}button{border:0;border-radius:12px;padding:14px 20px;background:var(--green);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.hidden{display:none!important}.msg{min-height:26px;font-weight:800;margin-top:10px}.error{color:var(--danger)}@media(max-width:760px){.rooms{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1>إدارة غرف الخزنة</h1><div>إنشاء غرف مستقلة برموز متغيرة.</div></div><div class="badge">__VERSION__</div></div><section id="loginCard" class="card"><h2>دخول المشرف</h2><div class="grid"><input id="pin" type="password" inputmode="numeric" placeholder="رمز المشرف"><button id="login">دخول</button></div><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h2>إنشاء غرفة جديدة</h2><div class="grid"><input id="roomName" maxlength="80" placeholder="اسم الغرفة — مثال: الغرفة الأولى"><button id="create">إنشاء الغرفة</button></div><div id="createMsg" class="msg"></div></section><section class="card"><div class="top" style="margin-bottom:12px"><h2 style="margin:0">الغرف الحالية</h2><button id="refresh">تحديث</button></div><div id="rooms" class="rooms"></div></section></div></main><script>
const $=id=>document.getElementById(id);let PIN=sessionStorage.getItem('vault_admin_pin')||'';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function checkPin(pin){const r=await fetch('/api/admin/check_pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});return r.ok}async function enter(){PIN=$('pin').value.trim();if(!await checkPin(PIN)){$('loginMsg').className='msg error';$('loginMsg').textContent='رمز المشرف غير صحيح.';return}sessionStorage.setItem('vault_admin_pin',PIN);$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');loadRooms()}async function loadRooms(){const r=await fetch('/api/admin/rooms?pin='+encodeURIComponent(PIN),{cache:'no-store'}),d=await r.json();if(!d.ok){sessionStorage.removeItem('vault_admin_pin');location.reload();return}const box=$('rooms');if(!d.rooms.length){box.innerHTML='<div class="meta">لا توجد غرف بعد.</div>';return}box.innerHTML=d.rooms.map(x=>`<article class="room"><h3>${esc(x.name)}</h3><div class="code">${esc(x.code)}</div><div class="meta">${esc(x.phase_ar)} · ${x.team_count} فريق · ${x.joins_open?'الانضمام مفتوح':'الانضمام مغلق'}</div><div class="actions"><a href="/room-admin?code=${encodeURIComponent(x.code)}&token=${encodeURIComponent(x.admin_token)}">لوحة الغرفة</a><a class="secondary" href="/display?code=${encodeURIComponent(x.code)}" target="_blank">شاشة العرض</a></div></article>`).join('')}async function createRoom(){const name=$('roomName').value.trim()||'غرفة الخزنة';$('create').disabled=true;const r=await fetch('/api/admin/create_room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,room_name:name})}),d=await r.json();$('create').disabled=false;if(!d.ok){$('createMsg').className='msg error';$('createMsg').textContent=d.message;return}$('createMsg').className='msg';$('createMsg').textContent='تم إنشاء الغرفة '+d.room.code+' ✓';$('roomName').value='';loadRooms()}$('login').onclick=enter;$('create').onclick=createRoom;$('refresh').onclick=loadRooms;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});if(PIN){$('pin').value=PIN;checkPin(PIN).then(ok=>{if(ok){$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');loadRooms()}})}setInterval(()=>{if(! $('app').classList.contains('hidden'))loadRooms()},3000);
</script></body></html>
